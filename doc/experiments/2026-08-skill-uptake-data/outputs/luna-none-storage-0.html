<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage used by tier</title>
<style>
  :root {
    color-scheme: light;
  }

  body {
    margin: 0;
    min-width: 720px;
    background: #f3f6fa;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  svg {
    display: block;
    margin: 24px auto;
    max-width: calc(100vw - 48px);
    height: auto;
    overflow: visible;
  }

  .plot-area {
    fill: #ffffff;
    stroke: #d8e1ec;
    stroke-width: 1;
  }

  .grid {
    stroke: #dfe6ef;
    stroke-width: 1;
  }

  .grid:nth-of-type(n + 7) {
    opacity: .35;
  }

  rect[data-series] {
    stroke: #ffffff;
    stroke-width: 1;
    rx: 2;
  }

  rect[data-series="hot"] { fill: #e76f51; }
  rect[data-series="warm"] { fill: #2a9d8f; }
  rect[data-series="cold"] { fill: #3867d6; }
  rect[data-series="archive"] { fill: #9b5de5; }

  .axis {
    stroke: #8795a8;
    stroke-width: 1.25;
  }

  text {
    fill: #526174;
    font-size: 11px;
  }

  .chart-title {
    fill: #1d2a3a;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .1px;
  }

  .axis-label {
    fill: #344255;
    font-size: 11px;
    font-weight: 600;
  }

  .legend-panel {
    fill: #ffffff;
    fill-opacity: .94;
    stroke: #d8e1ec;
    stroke-width: 1;
    rx: 5;
  }

  .legend text {
    fill: #344255;
    font-size: 10px;
    font-weight: 600;
  }
</style>
</head>
