<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage used by tier</title>
<style>
  :root { color-scheme: light; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9edf3;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  svg.card {
    display: block;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(26, 42, 68, 0.15);
  }

  .title { font-size: 17px; font-weight: 700; fill: #1d2836; letter-spacing: 0.4px; }
  .axis-label { font-size: 12px; fill: #5c6a7d; }
  .tick-label { font-size: 11px; fill: #5c6a7d; }
  .month-label { font-size: 12px; font-weight: 600; fill: #2b3947; }
  .grid-h { stroke: #e4e9f0; stroke-width: 1; }
  .grid-v { stroke: #eef1f5; stroke-width: 1; }
  .axis { stroke: #3a4451; stroke-width: 1.4; }
  .tick { stroke: #9aa6b4; stroke-width: 1; }
  .bar {
    stroke: #ffffff;
    stroke-width: 1;
    transition: filter 0.15s ease;
  }
  .bar:hover { filter: brightness(1.08) saturate(1.08); }
  .legend-text { font-size: 12px; fill: #3a4654; }
  .legend-line { stroke: #dfe4ec; stroke-width: 1; }
</style>
</head>
<body>
<svg class="card" xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11">
  <defs>
    <linearGradient id="grad-hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef7a55"/>
      <stop offset="1" stop-color="#d84a2a"/>
    </linearGradient>
    <linearGradient id="grad-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7bd6d"/>
      <stop offset="1" stop-color="#e98f1f"/>
    </linearGradient>
    <linearGradient id="grad-cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56a8c7"/>
      <stop offset="1" stop-color="#21708f"/>
    </linearGradient>
    <linearGradient id="grad-archive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d8cc0"/>
      <stop offset="1" stop-color="#6a578f"/>
    </linearGradient>
  </defs>

  <rect x="60" y="40" width="630" height="300" fill="#fafbfd" stroke="#d9dfe8" stroke-width="1" rx="2"/>

  <!-- Horizontal gridlines -->
  <line class="grid-h" x1="60" y1="40.0" x2="690" y2="40.0"/>
  <line class="grid-h" x1="60" y1="100.0" x2="690" y2="100.0"/>
  <line class="grid-h" x1="60" y1="160.0" x2="690" y2="160.0"/>
  <line class="grid-h" x1="60" y1="220.0" x2="690" y2="220.0"/>
  <line class="grid-h" x1="60" y1="280.0" x2="690" y2="280.0"/>
  <line class="grid-h" x1="60" y1="340.0" x2="690" y2="340.0"/>

  <!-- Vertical group separators -->
  <line class="grid-v" x1="186.0" y1="40" x2="186.0" y2="340"/>
  <line class="grid-v" x1="312.0" y1="40" x2="312.0" y2="340"/>
  <line class="grid-v" x1="438.0" y1="40" x2="438.0" y2="340"/>
  <line class="grid-v" x1="564.0" y1="40" x2="564.0" y2="340"/>
  <line class="grid-v" x1="690.0" y1="40" x2="690.0" y2="340"/>

  <!-- Bars (data unchanged) -->
  <rect class="bar" data-cat="Jan" data-series="hot" data-value="120" x="72.6" y="308.0" width="25.2" height="32.0" fill="url(#grad-hot)"><title>Jan · hot: 120</title></rect>
  <rect class="bar" data-cat="Jan" data-series="warm" data-value="340" x="97.8" y="249.4" width="25.2" height="90.6" fill="url(#grad-warm)"><title>Jan · warm: 340</title></rect>
  <rect class="bar" data-cat="Jan" data-series="cold" data-value="890" x="123.0" y="103.0" width="25.2" height="237.0" fill="url(#grad-cold)"><title>Jan · cold: 890</title></rect>
  <rect class="bar" data-cat="Jan" data-series="archive" data-value="210" x="148.2" y="284.1" width="25.2" height="55.9" fill="url(#grad-archive)"><title>Jan · archive: 210</title></rect>
  <rect class="bar" data-cat="Feb" data-series="hot" data-value="135" x="198.6" y="304.0" width="25.2" height="36.0" fill="url(#grad-hot)"><title>Feb · hot: 135</title></rect>
  <rect class="bar" data-cat="Feb" data-series="warm" data-value="358" x="223.8" y="244.7" width="25.2" height="95.3" fill="url(#grad-warm)"><title>Feb · warm: 358</title></rect>
  <rect class="bar" data-cat="Feb" data-series="cold" data-value="912" x="249.0" y="97.1" width="25.2" height="242.9" fill="url(#grad-cold)"><title>Feb · cold: 912</title></rect>
  <rect class="bar" data-cat="Feb" data-series="archive" data-value="214" x="274.2" y="283.0" width="25.2" height="57.0" fill="url(#grad-archive)"><title>Feb · archive: 214</title></rect>
  <rect class="bar" data-cat="Mar" data-series="hot" data-value="128" x="324.6" y="305.9" width="25.2" height="34.1" fill="url(#grad-hot)"><title>Mar · hot: 128</title></rect>
  <rect class="bar" data-cat="Mar" data-series="warm" data-value="371" x="349.8" y="241.2" width="25.2" height="98.8" fill="url(#grad-warm)"><title>Mar · warm: 371</title></rect>
  <rect class="bar" data-cat="Mar" data-series="cold" data-value="947" x="375.0" y="87.8" width="25.2" height="252.2" fill="url(#grad-cold)"><title>Mar · cold: 947</title></rect>
  <rect class="bar" data-cat="Mar" data-series="archive" data-value="219" x="400.2" y="281.7" width="25.2" height="58.3" fill="url(#grad-archive)"><title>Mar · archive: 219</title></rect>
  <rect class="bar" data-cat="Apr" data-series="hot" data-value="149" x="450.6" y="300.3" width="25.2" height="39.7" fill="url(#grad-hot)"><title>Apr · hot: 149</title></rect>
  <rect class="bar" data-cat="Apr" data-series="warm" data-value="389" x="475.8" y="236.4" width="25.2" height="103.6" fill="url(#grad-warm)"><title>Apr · warm: 389</title></rect>
  <rect class="bar" data-cat="Apr" data-series="cold" data-value="981" x="501.0" y="78.7" width="25.2" height="261.3" fill="url(#grad-cold)"><title>Apr · cold: 981</title></rect>
  <rect class="bar" data-cat="Apr" data-series="archive" data-value="223" x="526.2" y="280.6" width="25.2" height="59.4" fill="url(#grad-archive)"><title>Apr · archive: 223</title></rect>
  <rect class="bar" data-cat="May" data-series="hot" data-value="156" x="576.6" y="298.5" width="25.2" height="41.5" fill="url(#grad-hot)"><title>May · hot: 156</title></rect>
  <rect class="bar" data-cat="May" data-series="warm" data-value="402" x="601.8" y="232.9" width="25.2" height="107.1" fill="url(#grad-warm)"><title>May · warm: 402</title></rect>
  <rect class="bar" data-cat="May" data-series="cold" data-value="1024" x="627.0" y="67.3" width="25.2" height="272.7" fill="url(#grad-cold)"><title>May · cold: 1024</title></rect>
  <rect class="bar" data-cat="May" data-series="archive" data-value="228" x="652.2" y="279.3" width="25.2" height="60.7" fill="url(#grad-archive)"><title>May · archive: 228</title></rect>

  <!-- Axes -->
  <line class="axis" x1="60" y1="340" x2="690" y2="340"/>
  <line class="axis" x1="60" y1="40" x2="60" y2="340"/>
  <line class="tick" x1="55" y1="40.0" x2="60" y2="40.0"/>
  <line class="tick" x1="55" y1="100.0" x2="60" y2="100.0"/>
  <line class="tick" x1="55" y1="160.0" x2="60" y2="160.0"/>
  <line class="tick" x1="55" y1="220.0" x2="60" y2="220.0"/>
  <line class="tick" x1="55" y1="280.0" x2="60" y2="280.0"/>

  <!-- Y-axis labels -->
  <text class="tick-label" x="52" y="44.0" text-anchor="end">1126</text>
  <text class="tick-label" x="52" y="104.0" text-anchor="end">901</text>
  <text class="tick-label" x="52" y="164.0" text-anchor="end">676</text>
  <text class="tick-label" x="52" y="224.0" text-anchor="end">451</text>
  <text class="tick-label" x="52" y="284.0" text-anchor="end">225</text>
  <text class="tick-label" x="52" y="344.0" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text class="month-label" x="123.0" y="358" text-anchor="middle">Jan</text>
  <text class="month-label" x="249.0" y="358" text-anchor="middle">Feb</text>
  <text class="month-label" x="375.0" y="358" text-anchor="middle">Mar</text>
  <text class="month-label" x="501.0" y="358" text-anchor="middle">Apr</text>
  <text class="month-label" x="627.0" y="358" text-anchor="middle">May</text>

  <!-- Axis titles -->
  <text class="axis-label" x="360.0" y="380" text-anchor="middle">Month</text>
  <text class="axis-label" x="16" y="190.0" text-anchor="middle" transform="rotate(-90 16 190.0)">Amount</text>

  <!-- Title -->
  <text class="title" x="360.0" y="24" text-anchor="middle">Storage used by tier</text>

  <!-- Legend -->
  <line class="legend-line" x1="90" y1="384" x2="630" y2="384"/>
  <rect x="101" y="398" width="13" height="13" rx="3" fill="#d84a2a"/>
  <text class="legend-text" x="120" y="409">hot</text>
  <rect x="251" y="398" width="13" height="13" rx="3" fill="#e98f1f"/>
  <text class="legend-text" x="270" y="409">warm</text>
  <rect x="401" y="398" width="13" height="13" rx="3" fill="#21708f"/>
  <text class="legend-text" x="420" y="409">cold</text>
  <rect x="551" y="398" width="13" height="13" rx="3" fill="#6a578f"/>
  <text class="legend-text" x="570" y="409">archive</text>
</svg>
</body>
</html>
