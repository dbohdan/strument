<!DOCTYPE html>

  <!-- Y-axis labels -->
  <text x="52" y="44.0" text-anchor="end" fill="#6c757d">564</text>
  <text x="52" y="104.0" text-anchor="end" fill="#6c757d">451</text>
  <text x="52" y="164.0" text-anchor="end" fill="#6c757d">338</text>
  <text x="52" y="224.0" text-anchor="end" fill="#6c757d">225</text>
  <text x="52" y="284.0" text-anchor="end" fill="#6c757d">113</text>

  <!-- X-axis labels -->
  <text x="99.4" y="360" text-anchor="middle" fill="#6c757d">W1</text>
  <text x="178.1" y="360" text-anchor="middle" fill="#6c757d">W2</text>
  <text x="256.9" y="360" text-anchor="middle" fill="#6c757d">W3</text>

  <text x="375.0" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">Request latency by week</text>
