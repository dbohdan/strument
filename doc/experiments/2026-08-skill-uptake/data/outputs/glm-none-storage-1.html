<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage used by tier</title>
<style>
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #FFFFFF;
  }
  svg {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    max-width: 100%;
    height: auto;
  }
  .bar { transition: opacity 0.15s ease; }
  .bar:hover { opacity: 0.82; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-size="11">
  <!-- horizontal gridlines -->
  <line class="grid" x1="60" y1="40.0" x2="690" y2="40.0" stroke="#E4E8EC" stroke-width="1"/>
  <line class="grid" x1="60" y1="100.0" x2="690" y2="100.0" stroke="#E4E8EC" stroke-width="1"/>
  <line class="grid" x1="60" y1="160.0" x2="690" y2="160.0" stroke="#E4E8EC" stroke-width="1"/>
  <line class="grid" x1="60" y1="220.0" x2="690" y2="220.0" stroke="#E4E8EC" stroke-width="1"/>
  <line class="grid" x1="60" y1="280.0" x2="690" y2="280.0" stroke="#E4E8EC" stroke-width="1"/>

  <!-- bars: geometry, order, and data attributes unchanged -->
  <g>
    <rect class="bar" data-cat="Jan" data-series="hot" data-value="120" x="72.6" y="308.0" width="25.2" height="32.0" fill="#E15759"><title>Jan — hot: 120</title></rect>
    <rect class="bar" data-cat="Jan" data-series="warm" data-value="340" x="97.8" y="249.4" width="25.2" height="90.6" fill="#F28E2B"><title>Jan — warm: 340</title></rect>
    <rect class="bar" data-cat="Jan" data-series="cold" data-value="890" x="123.0" y="103.0" width="25.2" height="237.0" fill="#4E79A7"><title>Jan — cold: 890</title></rect>
    <rect class="bar" data-cat="Jan" data-series="archive" data-value="210" x="148.2" y="284.1" width="25.2" height="55.9" fill="#9AA5B1"><title>Jan — archive: 210</title></rect>
    <rect class="bar" data-cat="Feb" data-series="hot" data-value="135" x="198.6" y="304.0" width="25.2" height="36.0" fill="#E15759"><title>Feb — hot: 135</title></rect>
    <rect class="bar" data-cat="Feb" data-series="warm" data-value="358" x="223.8" y="244.7" width="25.2" height="95.3" fill="#F28E2B"><title>Feb — warm: 358</title></rect>
    <rect class="bar" data-cat="Feb" data-series="cold" data-value="912" x="249.0" y="97.1" width="25.2" height="242.9" fill="#4E79A7"><title>Feb — cold: 912</title></rect>
    <rect class="bar" data-cat="Feb" data-series="archive" data-value="214" x="274.2" y="283.0" width="25.2" height="57.0" fill="#9AA5B1"><title>Feb — archive: 214</title></rect>
    <rect class="bar" data-cat="Mar" data-series="hot" data-value="128" x="324.6" y="305.9" width="25.2" height="34.1" fill="#E15759"><title>Mar — hot: 128</title></rect>
    <rect class="bar" data-cat="Mar" data-series="warm" data-value="371" x="349.8" y="241.2" width="25.2" height="98.8" fill="#F28E2B"><title>Mar — warm: 371</title></rect>
    <rect class="bar" data-cat="Mar" data-series="cold" data-value="947" x="375.0" y="87.8" width="25.2" height="252.2" fill="#4E79A7"><title>Mar — cold: 947</title></rect>
    <rect class="bar" data-cat="Mar" data-series="archive" data-value="219" x="400.2" y="281.7" width="25.2" height="58.3" fill="#9AA5B1"><title>Mar — archive: 219</title></rect>

    <rect class="bar" data-cat="Apr" data-series="cold" data-value="981" x="501.0" y="78.7" width="25.2" height="261.3" fill="#4E79A7"><title>Apr — cold: 981</title></rect>

  <!-- y-axis tick labels -->
  <text x="52" y="44.0" text-anchor="end" fill="#57606A">1126</text>
  <text x="52" y="104.0" text-anchor="end" fill="#57606A">901</text>
  <text x="52" y="164.0" text-anchor="end" fill="#57606A">676</text>
  <text x="52" y="224.0" text-anchor="end" fill="#57606A">451</text>
  <text x="52" y="284.0" text-anchor="end" fill="#57606A">225</text>
  <text x="52" y="344.0" text-anchor="end" fill="#57606A">0</text>

  <!-- x-axis category labels -->
  <text x="123.0" y="358" text-anchor="middle" fill="#57606A">Jan</text>
  <text x="249.0" y="358" text-anchor="middle" fill="#57606A">Feb</text>
  <text x="375.0" y="358" text-anchor="middle" fill="#57606A">Mar</text>
  <text x="501.0" y="358" text-anchor="middle" fill="#57606A">Apr</text>
  <text x="627.0" y="358" text-anchor="middle" fill="#57606A">May</text>

  <!-- x-axis baseline -->
  <line x1="60" y1="340" x2="690" y2="340" stroke="#8B949E" stroke-width="1"/>

  <text x="16" y="190.0" text-anchor="middle" fill="#57606A" transform="rotate(-90 16 190.0)">Amount</text>
  <text x="360.0" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2328">Storage used by tier</text>

  <!-- legend -->
  <g class="legend">
    <rect x="217" y="372" width="12" height="12" rx="2.5" fill="#E15759"/>
    <text x="236" y="382" fill="#24292F">hot</text>
    <rect x="284" y="372" width="12" height="12" rx="2.5" fill="#F28E2B"/>
    <text x="303" y="382" fill="#24292F">warm</text>
    <rect x="365" y="372" width="12" height="12" rx="2.5" fill="#4E79A7"/>
    <text x="384" y="382" fill="#24292F">cold</text>
    <rect x="439" y="372" width="12" height="12" rx="2.5" fill="#9AA5B1"/>
    <text x="458" y="382" fill="#24292F">archive</text>
  </g>
</svg>
</body>
</html>
