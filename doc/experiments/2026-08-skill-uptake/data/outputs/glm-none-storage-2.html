<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage used by tier</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F1F5F9;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  .card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 10px 24px rgba(15, 23, 42, 0.07);
    padding: 10px;
  }
</style>
</head>
<body>
<div class="card">
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-label="Grouped bar chart of storage used by tier, January through May" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11">
  <!-- Plot area -->
  <rect x="60" y="40" width="630" height="300" fill="#FFFFFF"/>

  <!-- Horizontal gridlines -->
  <line class="grid" x1="60" y1="40.0" x2="690" y2="40.0" stroke="#E2E8F0" stroke-width="1" shape-rendering="crispEdges"/>
  <line class="grid" x1="60" y1="100.0" x2="690" y2="100.0" stroke="#E2E8F0" stroke-width="1" shape-rendering="crispEdges"/>
  <line class="grid" x1="60" y1="160.0" x2="690" y2="160.0" stroke="#E2E8F0" stroke-width="1" shape-rendering="crispEdges"/>
  <line class="grid" x1="60" y1="220.0" x2="690" y2="220.0" stroke="#E2E8F0" stroke-width="1" shape-rendering="crispEdges"/>
  <line class="grid" x1="60" y1="280.0" x2="690" y2="280.0" stroke="#E2E8F0" stroke-width="1" shape-rendering="crispEdges"/>

  <!-- Bars -->
  <rect data-cat="Jan" data-series="hot" data-value="120" x="72.6" y="308.0" width="25.2" height="32.0" fill="#E15759" rx="2"/>
  <rect data-cat="Jan" data-series="warm" data-value="340" x="97.8" y="249.4" width="25.2" height="90.6" fill="#F28E2B" rx="2"/>
  <rect data-cat="Jan" data-series="cold" data-value="890" x="123.0" y="103.0" width="25.2" height="237.0" fill="#4E79A7" rx="2"/>
  <rect data-cat="Jan" data-series="archive" data-value="210" x="148.2" y="284.1" width="25.2" height="55.9" fill="#BAB0AC" rx="2"/>
  <rect data-cat="Feb" data-series="hot" data-value="135" x="198.6" y="304.0" width="25.2" height="36.0" fill="#E15759" rx="2"/>
  <rect data-cat="Feb" data-series="warm" data-value="358" x="223.8" y="244.7" width="25.2" height="95.3" fill="#F28E2B" rx="2"/>
  <rect data-cat="Feb" data-series="cold" data-value="912" x="249.0" y="97.1" width="25.2" height="242.9" fill="#4E79A7" rx="2"/>
  <rect data-cat="Feb" data-series="archive" data-value="214" x="274.2" y="283.0" width="25.2" height="57.0" fill="#BAB0AC" rx="2"/>
  <rect data-cat="Mar" data-series="hot" data-value="128" x="324.6" y="305.9" width="25.2" height="34.1" fill="#E15759" rx="2"/>
  <rect data-cat="Mar" data-series="warm" data-value="371" x="349.8" y="241.2" width="25.2" height="98.8" fill="#F28E2B" rx="2"/>
  <rect data-cat="Mar" data-series="cold" data-value="947" x="375.0" y="87.8" width="25.2" height="252.2" fill="#4E79A7" rx="2"/>
  <rect data-cat="Mar" data-series="archive" data-value="219" x="400.2" y="281.7" width="25.2" height="58.3" fill="#BAB0AC" rx="2"/>
  <rect data-cat="Apr" data-series="hot" data-value="149" x="450.6" y="300.3" width="25.2" height="39.7" fill="#E15759" rx="2"/>
  <rect data-cat="Apr" data-series="warm" data-value="389" x="475.8" y="236.4" width="25.2" height="103.6" fill="#F28E2B" rx="2"/>
  <rect data-cat="Apr" data-series="cold" data-value="981" x="501.0" y="78.7" width="25.2" height="261.3" fill="#4E79A7" rx="2"/>
  <rect data-cat="Apr" data-series="archive" data-value="223" x="526.2" y="280.6" width="25.2" height="59.4" fill="#BAB0AC" rx="2"/>
  <rect data-cat="May" data-series="hot" data-value="156" x="576.6" y="298.5" width="25.2" height="41.5" fill="#E15759" rx="2"/>
  <rect data-cat="May" data-series="warm" data-value="402" x="601.8" y="232.9" width="25.2" height="107.1" fill="#F28E2B" rx="2"/>
  <rect data-cat="May" data-series="cold" data-value="1024" x="627.0" y="67.3" width="25.2" height="272.7" fill="#4E79A7" rx="2"/>
  <rect data-cat="May" data-series="archive" data-value="228" x="652.2" y="279.3" width="25.2" height="60.7" fill="#BAB0AC" rx="2"/>

  <!-- Baseline -->
  <line x1="60" y1="340" x2="690" y2="340" stroke="#94A3B8" stroke-width="1" shape-rendering="crispEdges"/>

  <!-- Y-axis tick labels -->
  <text x="52" y="44.0" text-anchor="end" fill="#64748B">1126</text>
  <text x="52" y="104.0" text-anchor="end" fill="#64748B">901</text>
  <text x="52" y="164.0" text-anchor="end" fill="#64748B">676</text>
  <text x="52" y="224.0" text-anchor="end" fill="#64748B">451</text>
  <text x="52" y="284.0" text-anchor="end" fill="#64748B">225</text>
  <text x="52" y="344.0" text-anchor="end" fill="#64748B">0</text>

  <!-- X-axis category labels -->
  <text x="123.0" y="358" text-anchor="middle" fill="#475569">Jan</text>
  <text x="249.0" y="358" text-anchor="middle" fill="#475569">Feb</text>
  <text x="375.0" y="358" text-anchor="middle" fill="#475569">Mar</text>
  <text x="501.0" y="358" text-anchor="middle" fill="#475569">Apr</text>
  <text x="627.0" y="358" text-anchor="middle" fill="#475569">May</text>

  <!-- Axis title -->
  <text x="16" y="190.0" text-anchor="middle" fill="#475569" transform="rotate(-90 16 190.0)">Amount</text>

  <!-- Chart title -->
  <text x="375.0" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Storage used by tier</text>

  <!-- Legend -->
  <g class="legend">
    <rect x="704" y="50" width="12" height="12" rx="3" fill="#E15759"/>
    <text x="722" y="60" fill="#475569">hot</text>
    <rect x="704" y="68" width="12" height="12" rx="3" fill="#F28E2B"/>
    <text x="722" y="78" fill="#475569">warm</text>
    <rect x="704" y="86" width="12" height="12" rx="3" fill="#4E79A7"/>
    <text x="722" y="96" fill="#475569">cold</text>
    <rect x="704" y="104" width="12" height="12" rx="3" fill="#BAB0AC"/>
    <text x="722" y="114" fill="#475569">archive</text>
  </g>
</svg>
</div>
</body>
</html>
