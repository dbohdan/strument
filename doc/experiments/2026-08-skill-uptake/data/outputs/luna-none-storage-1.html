<!DOCTYPE html>

<style>
  :root {
    color-scheme: light;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    display: grid;
    place-items: center;
    background: #f3f6fa;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  svg {

    height: auto;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .plot-area {
    fill: #ffffff;
    stroke: #d7e0ea;
    stroke-width: 1;
  }

  .grid {
    stroke: #dfe7ef !important;
    stroke-width: 1;
  }

  .bar {
    stroke: rgba(255, 255, 255, 0.78);
    stroke-width: 1;
    shape-rendering: geometricPrecision;
  }

  [data-series="hot"] {
    fill: #e76f51 !important;
  }

  [data-series="warm"] {
    fill: #e9a23b !important;
  }

  [data-series="cold"] {
    fill: #457b9d !important;
  }

  [data-series="archive"] {
    fill: #8064a2 !important;
  }

  .axis {
    stroke: #8b9bad;
    stroke-width: 1.25;
  }

  .tick-label,
  .axis-label {
    fill: #68788a;
  }

  .chart-title {
    fill: #1f2d3d;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1px;
  }

  .legend-panel {
    fill: #ffffff;
    stroke: #d7e0ea;
    stroke-width: 1;
  }

  .legend text {
    fill: #344454 !important;
    font-size: 11px;
  }
</style>
</head>
