<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request latency by week</title>
<style>
  :root {
    --p50: #2563eb;
    --p95: #f59e0b;
    --p99: #dc2626;
    --ink: #0f172a;
    --muted: #64748b;
    --axis: #cbd5e1;
    --grid: #eef2f7;
    --plot-border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .chart {
    display: block;
    font-size: 12px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.10), 0 2px 6px rgba(15, 23, 42, 0.05);
  }
  .plot { fill: #ffffff; stroke: var(--plot-border); stroke-width: 1; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .title { font-size: 16px; font-weight: 600; fill: var(--ink); }
  .subtitle { font-size: 12px; fill: var(--muted); }
  .axis-label { font-size: 11px; fill: var(--muted); }
  .axis-title { font-size: 12px; fill: var(--muted); letter-spacing: 0.8px; }
  .legend-text { font-size: 11px; fill: var(--ink); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .series-p50 { stroke: var(--p50); }
  .series-p95 { stroke: var(--p95); }
  .series-p99 { stroke: var(--p99); }
  .dot { stroke: #ffffff; stroke-width: 1.5; }
  .dot:hover { stroke-width: 2.5; cursor: pointer; }
  .dot-p50 { fill: var(--p50); }
  .dot-p95 { fill: var(--p95); }
  .dot-p99 { fill: var(--p99); }
</style>
</head>
<body>
<svg class="chart" xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Request latency by week</title>
  <desc id="chart-desc">Line chart of median (p50), 95th percentile (p95) and 99th percentile (p99) request latency in milliseconds over eight weeks.</desc>

  <rect class="plot" x="60" y="40" width="630" height="300"/>

  <line class="grid" x1="60" y1="40.0" x2="690" y2="40.0"/>
  <line class="grid" x1="60" y1="100.0" x2="690" y2="100.0"/>
  <line class="grid" x1="60" y1="160.0" x2="690" y2="160.0"/>
  <line class="grid" x1="60" y1="220.0" x2="690" y2="220.0"/>
  <line class="grid" x1="60" y1="280.0" x2="690" y2="280.0"/>
  <line class="grid" x1="60" y1="340.0" x2="690" y2="340.0"/>
  <line class="grid" x1="60.0" y1="40" x2="60.0" y2="340"/>
  <line class="grid" x1="150.0" y1="40" x2="150.0" y2="340"/>
  <line class="grid" x1="240.0" y1="40" x2="240.0" y2="340"/>
  <line class="grid" x1="330.0" y1="40" x2="330.0" y2="340"/>
  <line class="grid" x1="420.0" y1="40" x2="420.0" y2="340"/>
  <line class="grid" x1="510.0" y1="40" x2="510.0" y2="340"/>
  <line class="grid" x1="600.0" y1="40" x2="600.0" y2="340"/>
  <line class="grid" x1="690.0" y1="40" x2="690.0" y2="340"/>

  <polyline class="line series-p50" data-series="p50" points="60.0,317.6 150.0,316.0 240.0,318.2 330.0,314.4 420.0,316.6 510.0,315.0 600.0,317.1 690.0,315.5"/>
  <circle class="dot dot-p50" data-series="p50" data-cat="W1" data-value="42" cx="60.0" cy="317.6" r="3"><title>W1 · p50 · 42 ms</title></circle>
  <circle class="dot dot-p50" data-series="p50" data-cat="W2" data-value="45" cx="150.0" cy="316.0" r="3"><title>W2 · p50 · 45 ms</title></circle>
  <circle class="dot dot-p50" data-series="p50" data-cat="W3" data-value="41" cx="240.0" cy="318.2" r="3"><title>W3 · p50 · 41 ms</title></circle>
  <circle class="dot dot-p50" data-series="p50" data-cat="W4" data-value="48" cx="330.0" cy="314.4" r="3"><title>W4 · p50 · 48 ms</title></circle>
  <circle class="dot dot-p50" data-series="p50" data-cat="W5" data-value="44" cx="420.0" cy="316.6" r="3"><title>W5 · p50 · 44 ms</title></circle>
  <circle class="dot dot-p50" data-series="p50" data-cat="W6" data-value="47" cx="510.0" cy="315.0" r="3"><title>W6 · p50 · 47 ms</title></circle>
  <circle class="dot dot-p50" data-series="p50" data-cat="W7" data-value="43" cx="600.0" cy="317.1" r="3"><title>W7 · p50 · 43 ms</title></circle>
  <circle class="dot dot-p50" data-series="p50" data-cat="W8" data-value="46" cx="690.0" cy="315.5" r="3"><title>W8 · p50 · 46 ms</title></circle>

  <polyline class="line series-p95" data-series="p95" points="60.0,244.2 150.0,236.2 240.0,248.4 330.0,228.2 420.0,239.9 510.0,230.9 600.0,244.7 690.0,234.6"/>
  <circle class="dot dot-p95" data-series="p95" data-cat="W1" data-value="180" cx="60.0" cy="244.2" r="3"><title>W1 · p95 · 180 ms</title></circle>
  <circle class="dot dot-p95" data-series="p95" data-cat="W2" data-value="195" cx="150.0" cy="236.2" r="3"><title>W2 · p95 · 195 ms</title></circle>
  <circle class="dot dot-p95" data-series="p95" data-cat="W3" data-value="172" cx="240.0" cy="248.4" r="3"><title>W3 · p95 · 172 ms</title></circle>
  <circle class="dot dot-p95" data-series="p95" data-cat="W4" data-value="210" cx="330.0" cy="228.2" r="3"><title>W4 · p95 · 210 ms</title></circle>
  <circle class="dot dot-p95" data-series="p95" data-cat="W5" data-value="188" cx="420.0" cy="239.9" r="3"><title>W5 · p95 · 188 ms</title></circle>
  <circle class="dot dot-p95" data-series="p95" data-cat="W6" data-value="205" cx="510.0" cy="230.9" r="3"><title>W6 · p95 · 205 ms</title></circle>
  <circle class="dot dot-p95" data-series="p95" data-cat="W7" data-value="179" cx="600.0" cy="244.7" r="3"><title>W7 · p95 · 179 ms</title></circle>
  <circle class="dot dot-p95" data-series="p95" data-cat="W8" data-value="198" cx="690.0" cy="234.6" r="3"><title>W8 · p95 · 198 ms</title></circle>

  <polyline class="line series-p99" data-series="p99" points="60.0,116.4 150.0,97.8 240.0,126.5 330.0,79.1 420.0,107.3 510.0,85.5 600.0,119.1 690.0,94.0"/>
  <circle class="dot dot-p99" data-series="p99" data-cat="W1" data-value="420" cx="60.0" cy="116.4" r="3"><title>W1 · p99 · 420 ms</title></circle>
  <circle class="dot dot-p99" data-series="p99" data-cat="W2" data-value="455" cx="150.0" cy="97.8" r="3"><title>W2 · p99 · 455 ms</title></circle>
  <circle class="dot dot-p99" data-series="p99" data-cat="W3" data-value="401" cx="240.0" cy="126.5" r="3"><title>W3 · p99 · 401 ms</title></circle>
  <circle class="dot dot-p99" data-series="p99" data-cat="W4" data-value="490" cx="330.0" cy="79.1" r="3"><title>W4 · p99 · 490 ms</title></circle>
  <circle class="dot dot-p99" data-series="p99" data-cat="W5" data-value="437" cx="420.0" cy="107.3" r="3"><title>W5 · p99 · 437 ms</title></circle>
  <circle class="dot dot-p99" data-series="p99" data-cat="W6" data-value="478" cx="510.0" cy="85.5" r="3"><title>W6 · p99 · 478 ms</title></circle>
  <circle class="dot dot-p99" data-series="p99" data-cat="W7" data-value="415" cx="600.0" cy="119.1" r="3"><title>W7 · p99 · 415 ms</title></circle>
  <circle class="dot dot-p99" data-series="p99" data-cat="W8" data-value="462" cx="690.0" cy="94.0" r="3"><title>W8 · p99 · 462 ms</title></circle>

  <line class="axis-line" x1="60" y1="340" x2="690" y2="340"/>
  <line class="axis-line" x1="60" y1="40" x2="60" y2="340"/>

  <text class="axis-label" x="52" y="44.0" text-anchor="end">564</text>
  <text class="axis-label" x="52" y="104.0" text-anchor="end">451</text>
  <text class="axis-label" x="52" y="164.0" text-anchor="end">338</text>
  <text class="axis-label" x="52" y="224.0" text-anchor="end">225</text>
  <text class="axis-label" x="52" y="284.0" text-anchor="end">113</text>
  <text class="axis-label" x="52" y="344.0" text-anchor="end">0</text>

  <text class="axis-label" x="60" y="358" text-anchor="middle">W1</text>
  <text class="axis-label" x="150" y="358" text-anchor="middle">W2</text>
  <text class="axis-label" x="240" y="358" text-anchor="middle">W3</text>
  <text class="axis-label" x="330" y="358" text-anchor="middle">W4</text>
  <text class="axis-label" x="420" y="358" text-anchor="middle">W5</text>
  <text class="axis-label" x="510" y="358" text-anchor="middle">W6</text>
  <text class="axis-label" x="600" y="358" text-anchor="middle">W7</text>
  <text class="axis-label" x="690" y="358" text-anchor="middle">W8</text>

  <text class="axis-title" x="16" y="190.0" text-anchor="middle" transform="rotate(-90 16 190.0)">Latency (ms)</text>

  <text class="title" x="60" y="24">Request latency by week</text>
  <text class="subtitle" x="60" y="36">p50 · p95 · p99 latency, in milliseconds</text>

  <g class="legend">
    <line class="line series-p50" x1="470" y1="18" x2="484" y2="18"/>
    <circle class="dot dot-p50" cx="477" cy="18" r="3"/>
    <text class="legend-text" x="490" y="24">p50</text>
    <line class="line series-p95" x1="530" y1="18" x2="544" y2="18"/>
    <circle class="dot dot-p95" cx="537" cy="18" r="3"/>
    <text class="legend-text" x="550" y="24">p95</text>
    <line class="line series-p99" x1="594" y1="18" x2="608" y2="18"/>
    <circle class="dot dot-p99" cx="601" cy="18" r="3"/>
    <text class="legend-text" x="614" y="24">p99</text>
  </g>
</svg>
</body>
</html>
