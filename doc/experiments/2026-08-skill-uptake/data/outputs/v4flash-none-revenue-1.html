<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quarterly revenue</title>
<style>
  body {
    margin: 0;
    padding: 32px;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #EFF2F6;
  }
  svg {
    display: block;
    background: #FFFFFF;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .bar {
    transition: opacity .15s ease-in;
  }
  .bar:hover {
    opacity: .8;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Quarterly revenue by quarter, comparing 2025 and 2026">
  <!-- Chart frame -->
  <rect x="60" y="40" width="630" height="300" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Horizontal grid lines (0-700 scale over 300px) -->
  <g class="grid" stroke="#E5E7EB" stroke-width="1">
    <line x1="60" y1="82.86" x2="690" y2="82.86"/>
    <line x1="60" y1="125.71" x2="690" y2="125.71"/>
    <line x1="60" y1="168.57" x2="690" y2="168.57"/>
    <line x1="60" y1="211.43" x2="690" y2="211.43"/>
    <line x1="60" y1="254.29" x2="690" y2="254.29"/>
    <line x1="60" y1="297.14" x2="690" y2="297.14"/>
  </g>

  <!-- Axes -->
  <line class="baseline" x1="60" y1="340" x2="690" y2="340" stroke="#A7B0BC" stroke-width="1"/>
  <g class="axis" stroke="#D1D5DB" stroke-width="1">
    <line x1="60" y1="40" x2="60" y2="340"/>
  </g>

  <!-- Y-axis ticks -->
  <g class="ticks" stroke="#A7B0BC" stroke-width="1">
    <line x1="55" y1="82.86" x2="60" y2="82.86"/>
    <line x1="55" y1="125.71" x2="60" y2="125.71"/>
    <line x1="55" y1="168.57" x2="60" y2="168.57"/>
    <line x1="55" y1="211.43" x2="60" y2="211.43"/>
    <line x1="55" y1="254.29" x2="60" y2="254.29"/>
    <line x1="55" y1="297.14" x2="60" y2="297.14"/>
    <line x1="55" y1="340" x2="60" y2="340"/>
  </g>

  <!-- X-axis ticks -->
  <g class="ticks" stroke="#A7B0BC" stroke-width="1">
    <line x1="112.5" y1="340" x2="112.5" y2="345"/>
    <line x1="217.5" y1="340" x2="217.5" y2="345"/>
    <line x1="322.5" y1="340" x2="322.5" y2="345"/>
    <line x1="427.5" y1="340" x2="427.5" y2="345"/>
    <line x1="532.5" y1="340" x2="532.5" y2="345"/>
    <line x1="637.5" y1="340" x2="637.5" y2="345"/>
  </g>

  <!-- Y-axis labels -->
  <g font-size="11" fill="#6B7280" text-anchor="end">
    <text x="51" y="86.86">600</text>
    <text x="51" y="129.71">500</text>
    <text x="51" y="172.57">400</text>
    <text x="51" y="215.43">300</text>
    <text x="51" y="258.29">200</text>
    <text x="51" y="301.14">100</text>
    <text x="51" y="344">0</text>
  </g>

  <!-- Bars -->
  <g class="bars">
    <rect class="bar" data-cat="Q1" data-series="2025" data-value="412" x="76.5" y="163.43" width="34" height="176.57" rx="2" fill="#4C72B0" stroke="#3A5E93" stroke-width="1"><title>Q1 2025: 412</title></rect>
    <rect class="bar" data-cat="Q1" data-series="2026" data-value="455" x="114.5" y="145.0" width="34" height="195.0" rx="2" fill="#DD8452" stroke="#C26E3B" stroke-width="1"><title>Q1 2026: 455</title></rect>
    <rect class="bar" data-cat="Q2" data-series="2025" data-value="388" x="181.5" y="173.71" width="34" height="166.29" rx="2" fill="#4C72B0" stroke="#3A5E93" stroke-width="1"><title>Q2 2025: 388</title></rect>
    <rect class="bar" data-cat="Q2" data-series="2026" data-value="470" x="219.5" y="138.57" width="34" height="201.43" rx="2" fill="#DD8452" stroke="#C26E3B" stroke-width="1"><title>Q2 2026: 470</title></rect>
    <rect class="bar" data-cat="Q3" data-series="2025" data-value="455" x="286.5" y="145.0" width="34" height="195.0" rx="2" fill="#4C72B0" stroke="#3A5E93" stroke-width="1"><title>Q3 2025: 455</title></rect>
    <rect class="bar" data-cat="Q3" data-series="2026" data-value="498" x="324.5" y="126.57" width="34" height="213.43" rx="2" fill="#DD8452" stroke="#C26E3B" stroke-width="1"><title>Q3 2026: 498</title></rect>
    <rect class="bar" data-cat="Q4" data-series="2025" data-value="501" x="391.5" y="125.29" width="34" height="214.71" rx="2" fill="#4C72B0" stroke="#3A5E93" stroke-width="1"><title>Q4 2025: 501</title></rect>
    <rect class="bar" data-cat="Q4" data-series="2026" data-value="560" x="429.5" y="100.0" width="34" height="240.0" rx="2" fill="#DD8452" stroke="#C26E3B" stroke-width="1"><title>Q4 2026: 560</title></rect>
    <rect class="bar" data-cat="Q5" data-series="2025" data-value="470" x="496.5" y="138.57" width="34" height="201.43" rx="2" fill="#4C72B0" stroke="#3A5E93" stroke-width="1"><title>Q5 2025: 470</title></rect>
    <rect class="bar" data-cat="Q5" data-series="2026" data-value="544" x="534.5" y="106.86" width="34" height="233.14" rx="2" fill="#DD8452" stroke="#C26E3B" stroke-width="1"><title>Q5 2026: 544</title></rect>
    <rect class="bar" data-cat="Q6" data-series="2025" data-value="523" x="601.5" y="115.86" width="34" height="224.14" rx="2" fill="#4C72B0" stroke="#3A5E93" stroke-width="1"><title>Q6 2025: 523</title></rect>
    <rect class="bar" data-cat="Q6" data-series="2026" data-value="611" x="639.5" y="78.14" width="34" height="261.86" rx="2" fill="#DD8452" stroke="#C26E3B" stroke-width="1"><title>Q6 2026: 611</title></rect>
  </g>

  <!-- Value labels -->
  <g font-size="10" fill="#6B7280" text-anchor="middle">
    <text x="93.5" y="158.43">412</text>
    <text x="131.5" y="140.0">455</text>
    <text x="198.5" y="168.71">388</text>
    <text x="236.5" y="133.57">470</text>
    <text x="303.5" y="140.0">455</text>
    <text x="341.5" y="121.57">498</text>
    <text x="408.5" y="120.29">501</text>
    <text x="446.5" y="95.0">560</text>
    <text x="513.5" y="133.57">470</text>
    <text x="551.5" y="101.86">544</text>
    <text x="618.5" y="110.86">523</text>
    <text x="656.5" y="73.14">611</text>
  </g>

  <!-- Category labels -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="112.5" y="356">Q1</text>
    <text x="217.5" y="356">Q2</text>
    <text x="322.5" y="356">Q3</text>
    <text x="427.5" y="356">Q4</text>
    <text x="532.5" y="356">Q5</text>
    <text x="637.5" y="356">Q6</text>
  </g>

  <!-- Axis title -->
  <text x="18" y="190" text-anchor="middle" font-size="11" fill="#6B7280" transform="rotate(-90 18 190)">Revenue</text>

  <!-- Title -->
  <text x="375" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Quarterly revenue</text>

  <!-- Legend -->
  <g class="legend">
    <rect x="580" y="12" width="106" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="588" y="17" width="12" height="12" rx="2" fill="#4C72B0"/>
    <text x="604" y="27" font-size="12" fill="#374151">2025</text>
    <rect x="640" y="17" width="12" height="12" rx="2" fill="#DD8452"/>
    <text x="656" y="27" font-size="12" fill="#374151">2026</text>
  </g>
</svg>
</body>
</html>
