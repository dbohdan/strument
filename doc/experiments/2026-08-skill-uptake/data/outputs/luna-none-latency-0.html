<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request latency by week</title>
<style>
  :root {
    color-scheme: light;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f4f7fb;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  svg {
    max-width: 100%;
    height: auto;
    overflow: visible;
  }
  .chart-surface {
    fill: #ffffff;
    stroke: #dbe3ee;
    stroke-width: 1;
    filter: url(#shadow);
  }
  .grid {
    stroke: #e8edf3;
    stroke-width: 1;
  }
  .axis {
    stroke: #94a3b8;
    stroke-width: 1.25;
  }
  .tick-label,
  .category-label {
    fill: #64748b;
    font-size: 11px;
  }
  .axis-label {
    fill: #475569;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .chart-title {
    fill: #172033;
    font-size: 16px;
    font-weight: 700;
  }
  polyline {
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  circle {
    r: 4;
    stroke: #ffffff;
    stroke-width: 2;
  }
  .legend-panel {
    fill: #f8fafc;
    stroke: #e2e8f0;
    stroke-width: 1;
  }
  .legend-label {
    fill: #334155;
    font-size: 11px;
    font-weight: 600;
  }
  circle[data-series="p50"] {
    fill: #e05272;
  }
  circle[data-series="p95"] {
    fill: #159a9c;
  }
  circle[data-series="p99"] {
    fill: #5267d9;
  }
  text {
    fill: #64748b;
  }
  text[x="360.0"][y="24"] {
    fill: #172033;
  }
  g.legend rect:nth-of-type(2) {
    fill: #e05272;
  }
  g.legend rect:nth-of-type(3) {
    fill: #159a9c;
  }
  g.legend rect:nth-of-type(4) {
    fill: #5267d9;
  }
</style>
</head>
