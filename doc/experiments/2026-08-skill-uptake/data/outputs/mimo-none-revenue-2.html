<!DOCTYPE html>

  .chart-container {

    box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.04);

  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  .bar-group rect {
    transition: opacity 0.15s ease;

  .bar-group:hover rect {

</style>
</head>
