<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request latency by week</title>
<style>
  :root {
    --bg: #eef1f4;
    --card: #f9fafb;
    --plot: #ffffff;
    --ink: #1f2430;
    --muted: #5b6470;
    --border: #e1e5ea;
    --grid: #e7eaee;
    --axis: #9aa3ae;
    --c-p50: #4e79a7;
    --c-p95: #f28e2b;
    --c-p99: #e15759;
  }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }

  svg {
    display: block;
    max-width: 100%;
    height: auto;
    font-size: 12px;
    color: var(--ink);
  }

  /* Frame */
  .backdrop {
    fill: var(--card);
    filter: drop-shadow(0 1px 2px rgba(16, 24, 40, 0.06));
  }
  .plot {
    fill: var(--plot);
    stroke: var(--border);
    stroke-width: 1;
  }

  /* Gridlines: horizontal only; delete the .grid-x rule below to bring vertical guides back */
  .grid-y, .grid-x { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .grid-x { display: none; }

  /* Axes */
  .axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }

  /* Series */
  .s-p50 { color: var(--c-p50); }
  .s-p95 { color: var(--c-p95); }
  .s-p99 { color: var(--c-p99); }
  polyline.series {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  circle.series {
    fill: currentColor;
    stroke: #ffffff;
    stroke-width: 1.5;
  }

  /* Text */
  .chart-title { font-size: 17px; font-weight: 600; fill: var(--ink); }
  .axis-title { font-size: 11.5px; fill: var(--muted); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }

  /* Legend */
  .legend .swatch { fill: currentColor; }
  .legend text { font-size: 11.5px; fill: var(--ink); }
</style>
</head>
