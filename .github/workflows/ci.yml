name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than *-latest. A latest label moves to a new image
        # with little notice, and in November 2026 macos-latest meant the
        # macos-26 image, whose jobs were intermittently left queued without
        # a runner until GitHub cancelled them at 15 minutes. A pinned image
        # retires on an announced date instead.
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # The release variant: only the grammars strument uses compile in.
      - run: go build -tags "$(cat script/grammar-tags.txt)" ./cmd/strument
        shell: bash
      - run: go test -tags "$(cat script/grammar-tags.txt)" ./internal/repomap/
        shell: bash

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
