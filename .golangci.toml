version = "2"

[linters]
default = "standard"
enable = [
    # "arangolint",
    "asasalint",
    "asciicheck",
    "bidichk",
    "bodyclose",
    "canonicalheader",
    "containedctx",
    "copyloopvar",
    "decorder",
    # "depguard",
    "dogsled",
    "dupword",
    "durationcheck",
    "embeddedstructfieldcheck",
    "errcheck",
    "errchkjson",
    "errname",
    "errorlint",
    "exptostd",
    "fatcontext",
    # "forbidigo",
    "forcetypeassert",
    "ginkgolinter",
    "gocheckcompilerdirectives",
    "gochecksumtype",
    "gocritic",
    "godoclint",
    "godot",
    "goheader",
    "gomoddirectives",
    "gomodguard_v2",
    "goprintffuncname",
    "gosec",
    "gosmopolitan",
    "govet",
    "grouper",
    "iface",
    "importas",
    "inamedparam",
    "ineffassign",
    "interfacebloat",
    "intrange",
    "iotamixing",
    # "lll",
    "loggercheck",
    "makezero",
    "mirror",
    "misspell",
    "modernize",
    "musttag",
    "nakedret",
    "nilerr",
    "nilnesserr",
    "nilnil",
    "noctx",
    # "noinlineerr",
    "nolintlint",
    "nosprintfhostport",
    "perfsprint",
    "prealloc",
    "predeclared",
    "promlinter",
    "protogetter",
    "reassign",
    "recvcheck",
    "revive",
    "rowserrcheck",
    "sloglint",
    "spancheck",
    "sqlclosecheck",
    "staticcheck",
    "tagalign",
    "tagliatelle",
    "testableexamples",
    "testifylint",
    "thelper",
    "tparallel",
    "unconvert",
    "unparam",
    "unqueryvet",
    "unused",
    "usestdlibvars",
    "usetesting",
    "wastedassign",
    "whitespace",
    "zerologlint",
]

[[linters.exclusions.rules]]
path = "script/"
linters = [
    "gosec",
    "noctx",
]

[[linters.exclusions.rules]]
# The fixture recorder is a dev-only localhost proxy: SSRF/log-injection/
# timeout findings describe its intended function.
path = "cmd/strumentrec/"
linters = [
    "gosec",
    "noctx",
]

[[linters.exclusions.rules]]
# The git port runs local plumbing commands; the coder.Repo port is
# deliberately context-free (fast local operations, like aider's GitPython
# calls).
path = "internal/gitrepo/"
linters = [
    "noctx",
]

[[linters.exclusions.rules]]
# Tests write scratch files, scan committed testdata, and shell out to git
# to set up scratch repositories.
path = "_test\\.go"
linters = [
    "gosec",
    "godoclint",
    "noctx",
    "prealloc",
]

[[linters.exclusions.rules]]
# The round-trip test dereferences a map-lookup pointer behind an explicit
# nil check; SA5011 does not recognize the guard.
path = 'internal/modelconfig/roundtrip_test\.go'
linters = [
    "staticcheck",
]

[linters.settings.tagliatelle.case.rules]
json = "snake"
toml = "snake"
xml = "kebab"
yaml = "snake"

[linters.exclusions]
generated = "lax"
paths = [
    "reference",
    "attic",
    # Vendored fork of ergochat/readline (MIT), with Strument's own redraw and
    # key-handling changes. It is not held to Strument's lint ruleset; go vet
    # and go test still cover it.
    "internal/readline",
    # Vendored wrapper for the Pydantic Monty Python interpreter (MIT); see the
    # adjacent NOTICE. Kept in upstream style, like internal/readline; go vet
    # and go test still cover it.
    "internal/monty",
    # Trial fixtures: input to the experiments in doc/experiments, and several
    # of them hold the defect the model is asked to find. Holding them to the
    # project's ruleset would mean fixing the very thing the fixture exists to
    # present — an unused parameter that is the bug, a handler repeated three
    # times so an edit has to disambiguate. They stay gofmt'd, so they remain
    # realistic Go; the formatter exclusions below deliberately omit them.
    "doc/experiments",
    # Verbatim copies of go-git's gitignore matcher (Apache 2.0); see the
    # adjacent NOTICE. Only these three files are vendored — read.go and its
    # test are Strument's own and stay linted.
    "internal/gitignore/doc\\.go",
    "internal/gitignore/pattern\\.go",
    "internal/gitignore/matcher\\.go",
]
presets = [
    "comments",
    "common-false-positives",
    "legacy",
    "std-error-handling",
]

[formatters]
enable = [
    "gofmt",
    "goimports",
]

[formatters.exclusions]
generated = "lax"
paths = [
    "internal/readline",
    "internal/monty",
    "internal/gitignore/doc\\.go",
    "internal/gitignore/pattern\\.go",
    "internal/gitignore/matcher\\.go",
]

[output]
sort-order = [
    "file",
    "linter",
]
