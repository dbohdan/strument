version: '3'

env:
  CGO_ENABLED: 0

tasks:
  default:
    deps:
      - all

  all:
    desc: 'Build and test everything'
    deps:
      - build
      - test

  build:
    desc: 'Build all components'
    deps:
      - build:strument
      - build:strumentrec

  build:strument:
    desc: 'Build the strument binary'
    run: once
    cmds:
      - go build -trimpath ./cmd/strument
    sources:
      - cmd/strument/**/*.go
      - internal/**/*.go
    generates:
      - strument{{exeExt}}

  build:strument:subset:
    desc: 'Build strument with only the tree-sitter grammars it uses (release variant)'
    run: once
    cmds:
      - go build -trimpath -ldflags '-s -w' -tags "$(cat script/grammar-tags.txt)" -o strument-subset{{exeExt}} ./cmd/strument
    sources:
      - cmd/strument/**/*.go
      - internal/**/*.go
      - script/grammar-tags.txt
    generates:
      - strument-subset{{exeExt}}

  build:strumentrec:
    desc: 'Build the fixture recorder'
    run: once
    cmds:
      - go build -trimpath ./cmd/strumentrec
    sources:
      - cmd/strumentrec/**/*.go
      - internal/**/*.go
    generates:
      - strumentrec{{exeExt}}

  check:
    desc: 'Build, format, lint, and test everything'
    deps:
      - build
      - format
      - lint
      - test

  clean:
    desc: 'Clean up binaries'
    cmds:
      - rm -f strument{{exeExt}} strument-subset{{exeExt}} strumentrec{{exeExt}}

  setup:reference:
    desc: 'Clone aider at the pinned SHA into reference/ (dev/spec verification only)'
    cmds:
      - sh script/setup-reference.sh
    status:
      - test -e reference/.git

  format:
    desc: 'Format source code'
    cmds:
      - golangci-lint fmt ./...

  lint:
    desc: 'Run linters'
    cmds:
      - golangci-lint run

  release:
    desc: 'Prepare a release'
    deps:
      - build
    cmds:
      - VERSION=$(./strument{{exeExt}} --version) go run ./script/release

  test:
    desc: 'Run tests'
    cmds:
      - go test ./...
